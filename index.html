<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dcebe2">
    <title>Study Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top menu (your sliding-indicator style) -->
    <header class="menu-container">
        <div class="indicator" aria-hidden="true"></div>
        <ul class="manu" role="tablist" aria-label="Main menu">
            <li data-view="clock"><button role="tab" type="button">Clock</button></li>
            <li data-view="stopwatch"><button role="tab" type="button">Stopwatch</button></li>
            <li data-view="timer"><button role="tab" type="button">Timer</button></li>
        </ul>
    </header>

    <main>

        <!-- ============ CLOCK ============ -->
        <section class="view stage" id="view-clock" aria-label="Clock">
            <div class="device">
                <svg id="clock-dial" role="img" aria-label="Analog clock showing Phnom Penh time"></svg>
            </div>
            <div class="panel">
                <p class="eyebrow">Phnom Penh time (UTC+7)</p>
                <div class="readout" id="c-readout" aria-live="off">00:00:00</div>
                <p class="date" id="c-date"></p>
                <div class="actions">
                    <button class="btn" id="c-format" type="button" aria-pressed="true">24-hour</button>
                </div>
            </div>
        </section>

        <!-- ============ STOPWATCH ============ -->
        <section class="view stage" id="view-stopwatch" aria-label="Stopwatch" hidden>
            <div class="device">
                <svg id="sw-dial" role="img" aria-label="Stopwatch dial"></svg>
            </div>
            <div class="panel">
                <p class="eyebrow">Stopwatch</p>
                <div class="readout" id="sw-readout">00:00<span class="cs">.00</span></div>
                <div class="actions">
                    <button class="btn primary" id="sw-main" type="button">Start</button>
                    <button class="btn" id="sw-lap" type="button" disabled>Lap</button>
                    <button class="btn" id="sw-reset" type="button">Reset</button>
                </div>
                <ol class="laps" id="sw-laps" aria-label="Laps"></ol>
            </div>
        </section>

        <!-- ============ TIMER ============ -->
        <section class="view stage" id="view-timer" aria-label="Study timer" data-phase="focus" hidden>
            <div class="device">
                <svg id="timer-dial" role="img" aria-label="Timer dial. The coloured wedge shows the time left."></svg>
            </div>
            <div class="panel">
                <div class="phase">
                    <h2 id="t-phase">Focus</h2>
                    <p id="t-sub">Set 1 of 4</p>
                </div>
                <div class="readout" id="t-readout" role="timer">1:30:00</div>
                <div class="bar" aria-hidden="true"><span id="t-bar"></span></div>
                <div class="dots" id="t-dots" aria-hidden="true"></div>

                <div class="actions">
                    <button class="btn primary" id="t-main" type="button">Start focus</button>
                    <button class="btn" id="t-skip" type="button">Skip</button>
                    <button class="btn" id="t-reset" type="button">Reset</button>
                </div>
                <p class="note" id="t-next"></p>

                <div class="card settings">
                    <p class="card-title">Plan your session</p>

                    <div class="presets" role="group" aria-label="Quick presets">
                        <button class="chip" type="button" data-f="25" data-b="5" data-r="4">25 / 5</button>
                        <button class="chip" type="button" data-f="50" data-b="10" data-r="3">50 / 10</button>
                        <button class="chip" type="button" data-f="90" data-b="20" data-r="2">1h 30 / 20</button>
                    </div>

                    <div class="fields">
                        <label>Focus hours
                            <input id="focusH" type="number" inputmode="numeric" min="0" max="12" value="1">
                        </label>
                        <label>Focus minutes
                            <input id="focusM" type="number" inputmode="numeric" min="0" max="59" value="30">
                        </label>
                        <label>Break minutes
                            <input id="breakM" type="number" inputmode="numeric" min="0" max="120" value="20">
                        </label>
                        <label>Sets
                            <input id="rounds" type="number" inputmode="numeric" min="1" max="12" value="4">
                        </label>
                    </div>

                    <div class="toggles">
                        <label class="check"><input id="auto" type="checkbox" checked> Start next part automatically</label>
                        <label class="check"><input id="sound" type="checkbox" checked> Play a chime</label>
                    </div>

                    <p class="note" id="t-total"></p>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
